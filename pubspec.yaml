name: eduacademy
description: "EduAcademy - تطبيق أكاديمي وإدارة دورات تعليمية"
publish_to: 'none'
version: 1.3.0+6

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.3
  sqflite_common_ffi_web: ^0.4.5
  shared_preferences: 2.5.3
  http: 1.5.0
  crypto: ^3.0.3
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  # إرسال رمز التحقق (OTP) عبر SMTP - Android فقط (على الويب يُعرض الرمز داخل التطبيق)
  mailer: ^7.2.0

  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
